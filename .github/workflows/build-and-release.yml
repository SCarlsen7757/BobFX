name: Build and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore BobFx.slnx --locked-mode
      - name: Build with analyzers
        run: dotnet build BobFx.slnx --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test BobFx.slnx --configuration Release --no-build --logger trx
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install browser test dependencies
        working-directory: e2e
        run: npm ci
      - name: Typecheck browser tests
        working-directory: e2e
        run: npm run typecheck
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Test published Blazor app in Chromium
        working-directory: e2e
        run: npm test
      - name: Upload browser test report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-tests
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      - name: Test browser audio activation and cleanup
        run: node --test BobFx.Core.Tests/BrowserAudio.test.mjs
      - name: Test release policy and label categories
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Reject known vulnerable direct and transitive packages
        shell: bash
        run: |
          dotnet list BobFx.slnx package --vulnerable --include-transitive --format json > vulnerabilities.json
          python3 - <<'PY'
          import json
          report = json.load(open("vulnerabilities.json", encoding="utf-8-sig"))
          vulnerabilities = [
              package
              for project in report.get("projects", [])
              for framework in project.get("frameworks", [])
              for key in ("topLevelPackages", "transitivePackages")
              for package in framework.get(key, [])
              if package.get("vulnerabilities")
          ]
          if vulnerabilities:
              print(json.dumps(vulnerabilities, indent=2))
              raise SystemExit("Known vulnerable NuGet dependencies found")
          PY
      - name: Validate development and production Compose
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f compose.prod.yaml config --quiet
      - name: Scan repository configuration and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: BobFx.Core/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: bobfx:ci
          cache-from: type=gha,scope=${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}
      - name: Install image scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.75.0
      - name: Scan image and enforce reviewed vulnerability policy
        run: |
          mkdir -p release-evidence
          trivy image --image-src docker --scanners vuln --format json --ignorefile scripts/ci/empty-ignore --output release-evidence/scan.json bobfx:ci
          python3 scripts/ci/scan_policy.py release-evidence/scan.json --summary release-evidence/policy.json
      - name: Smoke test hardened runtime
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/ci/release.py smoke --image bobfx:ci --architecture "$ARCHITECTURE"
      - name: Retain image scan and smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-evidence-${{ matrix.architecture }}
          path: release-evidence/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version and registry name
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select candidate or existing stable digest for rerun
        id: candidate
        run: python3 scripts/ci/release.py select --image "$IMAGE" --version "$VERSION"
      - name: Build multi-architecture candidate once
        if: steps.candidate.outputs.existing == ''
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: BobFx.Core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.candidate.outputs.candidate }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Select exact verification digest
        id: verified
        env:
          EXISTING_DIGEST: ${{ steps.candidate.outputs.existing }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "digest=${EXISTING_DIGEST:-$BUILD_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_DIGEST=${EXISTING_DIGEST:-$BUILD_DIGEST}" >> "$GITHUB_ENV"
      - name: Install image scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.75.0
      - name: Verify both exact architecture digests and release metadata
        run: python3 scripts/ci/release.py verify --image "$IMAGE" --version "$VERSION" --digest "$CANDIDATE_DIGEST" --revision "$GITHUB_SHA"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.verified.outputs.digest }}
          push-to-registry: true
      - name: Promote tested index without rebuilding
        run: python3 scripts/ci/release.py promote --image "$IMAGE" --version "$VERSION" --digest "$CANDIDATE_DIGEST"
      - name: Retain release verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: release-evidence/
          retention-days: 90
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-evidence/*.json
            release-evidence/*.txt
            release-evidence/*.log
          body: |
            Production image: `${{ steps.version.outputs.image }}@${{ steps.verified.outputs.digest }}`
            Set `BOBFX_IMAGE_DIGEST=${{ steps.verified.outputs.digest }}` in your production .env.
            Supports linux/amd64 and linux/arm64. See README.md for deployment and migration.
