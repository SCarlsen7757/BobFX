version: 2
updates:
  - package-ecosystem: npm
    directory: /e2e
    labels: [chore, dependencies, web]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /
    labels: [chore, dependencies, api]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /BobFx.Core
    labels: [chore, dependencies, infra]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    labels: [chore, dependencies, infra]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
