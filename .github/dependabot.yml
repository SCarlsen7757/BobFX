version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    labels: [chore, dependencies, web]
    ignore:
      # The Node types move with the Node runtime in .nvmrc; newer major types can expose unavailable APIs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vue-tsc loads the JavaScript compiler, which TypeScript 7 no longer ships. Move when vue-tsc supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /e2e
    labels: [chore, dependencies, web]
    # The Node types move with the Node runtime in .nvmrc; newer major types can expose unavailable APIs.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /
    labels: [chore, dependencies, api]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /BobFx.Core
    labels: [chore, dependencies, infra]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    groups:
      # init and analyze must run the same version, so they update together.
      codeql-action:
        patterns: ["github/codeql-action/*"]
    labels: [chore, dependencies, infra]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
