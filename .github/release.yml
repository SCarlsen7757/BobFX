changelog:
  categories:
    - title: Breaking changes
      labels: [breaking change]
    - title: Security
      labels: [security]
      exclude:
        labels: [breaking change]
    - title: Features
      labels: [feature]
      exclude:
        labels: [breaking change, security]
    - title: Bug fixes
      labels: [bug]
      exclude:
        labels: [breaking change, security, feature]
    - title: Performance
      labels: [performance]
      exclude:
        labels: [breaking change, security, feature, bug]
    - title: Dependencies
      labels: [dependencies]
      exclude:
        labels: [breaking change, security, feature, bug, performance]
    - title: Documentation
      labels: [documentation]
      exclude:
        labels: [breaking change, security, feature, bug, performance, dependencies]
    - title: Maintenance
      labels: [refactor, chore]
      exclude:
        labels: [breaking change, security, feature, bug, performance, dependencies, documentation]
    - title: Other changes
      labels: ['*']
      exclude:
        labels: [breaking change, security, feature, bug, performance, dependencies, documentation, refactor, chore]
