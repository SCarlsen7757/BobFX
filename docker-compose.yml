# Development only. Production uses compose.prod.yaml explicitly.
services:
  bobfx:
    build:
      context: .
      dockerfile: BobFx.Core/Dockerfile
    ports:
      - "127.0.0.1:5159:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: "localhost;127.0.0.1"
      # The image does not contain appsettings.Development.json, so its values are set here.
      Logging__LogLevel__BobFx.Core.Services: Debug
      WLed__Led__LedCount: "24"
      Countdown__DurationSeconds: "60"
      Countdown__DeviationSeconds: "20"
    restart: "no"
    volumes:
      - bobfx-data:/app/data

volumes:
  bobfx-data:
